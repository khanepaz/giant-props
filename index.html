<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GIANT PROPS | ساخت وسایل غول‌پیکر</title>

  <!-- Fonts -->
  <link

  <!-- Bootstrap Icons -->
  <link

  <style>

    /* =========================================================
       FORMIXO / GIANT PROPS
       VISUAL SYSTEM
       Black / White / Golden Yellow
       ========================================================= */

    :root {

      /* Brand Colors */
      --yellow: #f5b21c;
      --yellow-light: #ffc94f;
      --yellow-dark: #d99300;

      --black: #070707;
      --black-2: #0d0d0d;
      --black-3: #151515;
      --black-4: #1c1c1c;

      --white: #f5f5f2;
      --white-soft: #ddddda;

      --gray: #a4a4a0;
      --gray-dark: #686864;

      --border: rgba(255, 255, 255, 0.08);
      --border-yellow: rgba(245, 178, 28, 0.45);

      --nav-h: 76px;

      --shadow:
        0 25px 60px rgba(0, 0, 0, 0.55);

      --shadow-yellow:
        0 18px 45px rgba(245, 178, 28, 0.16);
    }


    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(245, 178, 28, 0.06),
          transparent 30%
        ),
        var(--black);

      color: var(--white);

      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .brand-font {
      font-family:
        "Space Grotesk",
        "Vazirmatn",
        sans-serif;
    }

    section[id] {
      scroll-margin-top: var(--nav-h);
    }


    /* =========================================================
       TEXT
       ========================================================= */

    .brand-yellow {
      color: var(--yellow);
    }

    .gradient-text {

      background:
        linear-gradient(
          100deg,
          var(--yellow-dark),
          var(--yellow-light)
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-clip: text;
    }


    /* =========================================================
       NAVBAR
       ========================================================= */

    .navbar {

      height: var(--nav-h);

      background:
        rgba(7, 7, 7, 0.88) !important;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      z-index: 1000;
    }


    .navbar-brand {

      color: white !important;

      font-family:
        "Space Grotesk",
        sans-serif;

      font-weight: 800;

      letter-spacing: 1.5px;
    }


    .brand-logo {

      display: inline-flex;

      align-items: center;

      gap: 10px;
    }


    .brand-mark {

      width: 36px;
      height: 36px;

      border:
        2px solid var(--yellow);

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: var(--yellow);

      font-family:
        "Space Grotesk",
        sans-serif;

      font-weight: 800;

      font-size: 18px;
    }


    .brand-text {

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size: 1.1rem;

      letter-spacing: 1.5px;

      color: #fff;
    }


    .brand-text span {
      color: var(--yellow);
    }


    .nav-link {

      color: #cfcfcb !important;

      font-weight: 500;

      position: relative;

      transition:
        color 0.25s ease;
    }


    .nav-link::after {

      content: "";

      position: absolute;

      right: 0.7rem;
      left: 0.7rem;

      bottom: 2px;

      height: 2px;

      background: var(--yellow);

      transform:
        scaleX(0);

      transform-origin: center;

      transition:
        transform 0.25s ease;
    }


    .nav-link:hover {

      color: white !important;
    }


    .nav-link:hover::after {

      transform:
        scaleX(1);
    }


    .navbar-toggler {

      border:
        1px solid rgba(245,178,28,0.5);
    }


    .navbar-toggler:focus {

      box-shadow:
        0 0 0 0.2rem
        rgba(245,178,28,0.15);
    }


    .navbar-toggler-icon {

      filter:
        invert(1);
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {

      min-height: calc(100vh - var(--nav-h));

      display: flex;

      align-items: center;

      position: relative;

      padding:
        calc(var(--nav-h) + 3rem)
        0
        5rem;

      overflow: hidden;

      background:

        linear-gradient(
          135deg,
          #070707 0%,
          #0d0d0d 55%,
          #111111 100%
        );
    }


    /* Yellow geometric decoration */

    .hero::before {

      content: "";

      position: absolute;

      width: 380px;
      height: 700px;

      top: -100px;
      left: -160px;

      background:
        var(--yellow);

      transform:
        rotate(18deg);

      opacity: 0.07;

      pointer-events: none;
    }


    .hero::after {

      content: "";

      position: absolute;

      width: 260px;
      height: 600px;

      right: -160px;
      bottom: -180px;

      background:
        var(--yellow);

      transform:
        rotate(28deg);

      opacity: 0.06;

      pointer-events: none;
    }


    .hero-content {

      position: relative;

      z-index: 2;
    }


    .hero-eyebrow {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      color:
        var(--yellow);

      font-size: 0.95rem;

      font-weight: 600;

      margin-bottom: 1.2rem;
    }


    .hero-eyebrow .dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        var(--yellow);

      box-shadow:
        0 0 15px
        rgba(245,178,28,0.7);
    }


    .hero h1 {

      font-size:
        clamp(2.2rem, 5vw, 4.2rem);

      line-height: 1.2;

      font-weight: 900;

      margin-bottom: 1.5rem;

      letter-spacing: -1px;
    }


    .hero p.lead {

      max-width: 600px;

      color:
        var(--gray);

      font-size: 1.08rem;

      line-height: 2;

      margin-bottom: 2rem;
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .btn-brand {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      background:
        var(--yellow);

      color:
        #080808;

      border: none;

      font-weight: 800;

      padding:
        0.85rem 1.8rem;

      border-radius: 4px;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }


    .btn-brand:hover {

      background:
        var(--yellow-light);

      color:
        #080808;

      transform:
        translateY(-3px);

      box-shadow:
        0 12px 30px
        rgba(245,178,28,0.25);
    }


    .btn-outline-brand {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      background:
        transparent;

      color:
        var(--white);

      border:
        1px solid
        rgba(245,178,28,0.65);

      font-weight: 600;

      padding:
        0.85rem 1.8rem;

      border-radius: 4px;

      transition:
        all 0.25s ease;
    }


    .btn-outline-brand:hover {

      background:
        var(--yellow);

      color:
        #080808;

      border-color:
        var(--yellow);

      transform:
        translateY(-3px);
    }


    /* =========================================================
       HERO STATS
       ========================================================= */

    .hero-stats {

      display: flex;

      gap: 2.8rem;

      margin-top: 2.8rem;

      flex-wrap: wrap;
    }


    .hero-stat {

      position: relative;

      padding-right: 1.2rem;
    }


    .hero-stat::before {

      content: "";

      position: absolute;

      right: 0;
      top: 4px;

      width: 3px;
      height: 35px;

      background:
        var(--yellow);
    }


    .hero-stats .num {

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size: 1.7rem;

      font-weight: 800;

      color: white;
    }


    .hero-stats .label {

      color:
        var(--gray);

      font-size: 0.8rem;

      margin-top: 2px;
    }


    /* =========================================================
       HERO IMAGE
       ========================================================= */

    .hero-visual {

      /* position: relative; */

      max-width: 520px;

      margin: auto;

      aspect-ratio: 4 / 5;

      border-radius: 3px;

      overflow: hidden;

      background:
        #000;

      border:
        1px solid
        rgba(255,255,255,0.1);

      box-shadow:
        var(--shadow);

      z-index: 2;
    }


    .hero-visual::before {

      content: "";

      position: absolute;

      top: 0;
      right: 0;

      width: 8px;
      height: 100%;

      background:
        var(--yellow);

      z-index: 3;
    }


    .hero-visual img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    .hero-visual .dim-tag {

      position: absolute;

      right: 1rem;
      bottom: 1rem;

      padding:
        0.6rem 1rem;

      background:
        rgba(0,0,0,0.78);

      border:
        1px solid
        rgba(245,178,28,0.55);

      color:
        white;

      font-size: 0.8rem;

      border-radius: 3px;

      backdrop-filter:
        blur(8px);

      z-index: 4;
    }


    .hero-visual .dim-tag .fill {

      color:
        var(--yellow);

      font-weight: 700;
    }


    /* =========================================================
       SECTION
       ========================================================= */

    .section-dark {
      background:
        var(--black);
    }


    .section-panel {

      background:
        var(--black-2);
    }


    .section-title {

      position: relative;

      display: inline-block;

      font-weight: 800;

      margin-bottom: 1rem;
    }


    .section-title::after {

      content: "";

      display: block;

      width: 65px;
      height: 4px;

      margin-top: 13px;

      background:
        var(--yellow);

      transform:
        skewX(-25deg);
    }


    .section-subtitle {

      color:
        var(--gray);

      max-width: 600px;

      margin: auto;

      line-height: 1.9;
    }


    /* =========================================================
       ABOUT
       ========================================================= */

    #about {

      background:
        var(--black-2);

      position: relative;

      overflow: hidden;
    }


    #about::before {

      content: "";

      position: absolute;

      width: 180px;
      height: 100%;

      right: -100px;
      top: 0;

      background:
        var(--yellow);

      opacity: 0.035;

      transform:
        skewX(-15deg);
    }


    .about-img {

      /* position: relative; */

      aspect-ratio: 4 / 3;

      overflow: hidden;

      border-radius: 3px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        #000;
    }


    .about-img::after {

      content: "";

      position: absolute;

      bottom: 0;
      right: 0;

      width: 100%;
      height: 5px;

      background:
        var(--yellow);
    }


    .about-img img {

      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .about-list {

      margin-top: 1.8rem;
    }


    .about-list li {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 1rem;

      color:
        #d7d7d3;
    }


    .about-list i {

      color:
        var(--yellow);

      font-size: 1.05rem;
    }


    /* =========================================================
       FEATURED
       ========================================================= */

    #featured {

      background:
        #090909;
    }


    .carousel-frame {

      position: relative;

      aspect-ratio: 16 / 9;

      overflow: hidden;

      border-radius: 3px;

      background:
        #000;

      border:
        1px solid
        rgba(255,255,255,0.08);

      box-shadow:
        var(--shadow);
    }


    .carousel-item {

      height: 100%;
    }


    .carousel-item .bg-blur {

      position: absolute;

      inset: 0;

      background-size: cover;

      background-position: center;

      filter:
        blur(30px)
        brightness(0.3)
        saturate(0.7);

      transform:
        scale(1.15);
    }


    .carousel-item .fg-img {

      position: relative;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      margin: auto;
    }


    .carousel-caption {

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.92),
          rgba(0,0,0,0.68)
        );

      border-right:
        4px solid
        var(--yellow);

      padding:
        1rem 1.4rem;

      right: 1.5rem;
      left: 1.5rem;

      bottom: 1.5rem;

      text-align: right;

      border-radius: 2px;
    }


    .carousel-caption h3 {

      color:
        white;
    }


    .carousel-caption p {

      color:
        #c2c2be;
    }


    .carousel-control-prev,
    .carousel-control-next {

      width: 8%;
    }


    .carousel-indicators [data-bs-target] {

      width: 28px;
      height: 4px;

      border: 0;

      opacity: 0.4;

      background:
        #777;

      transition:
        all 0.25s ease;
    }


    .carousel-indicators .active {

      width: 45px;

      opacity: 1;

      background:
        var(--yellow);
    }


    /* =========================================================
       GALLERY
       ========================================================= */

    #gallery {

      background:
        var(--black);
    }


    .gallery-card {

      height: 100%;

      background:
        var(--black-3);

      border:
        1px solid
        rgba(255,255,255,0.07);

      border-radius: 3px;

      overflow: hidden;

      cursor: pointer;

      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }


    .gallery-card:hover {

      transform:
        translateY(-7px);

      border-color:
        var(--border-yellow);

      box-shadow:
        var(--shadow-yellow);
    }


    .gallery-card .img-wrap {

      position: relative;

      height: 290px;

      overflow: hidden;

      background:
        #000;
    }


    .gallery-card .img-wrap::before {

      content: "";

      position: absolute;

      top: 0;
      right: 0;

      width: 5px;
      height: 100%;

      background:
        var(--yellow);

      z-index: 3;

      transform:
        scaleY(0);

      transform-origin: bottom;

      transition:
        transform 0.3s ease;
    }


    .gallery-card:hover .img-wrap::before {

      transform:
        scaleY(1);
    }

      inset: 0;
